name: boulder
description: Codex-ready OSS maintainer harness for Boulder.
maintainers:
  - min9lin9
workflowStack:
  - name: superpowers
    role: workflow-spine
    required: true
    description: Drives brainstorming, planning, implementation, debugging, review, and verification discipline.
  - name: gstack
    role: review-gate
    required: true
    description: Adds CSO, QA, executive, and office-hours review gates before risky implementation or release decisions.
  - name: compound
    role: learning-layer
    required: true
    description: Captures reusable decisions, repeated failure modes, and durable workflow improvements after each cycle.
workflows:
  - issue-triage
  - pr-review-prep
  - release-planning
  - dependency-review
  - verification-gate
protectedPaths:
  - .env*
  - secrets/**
  - vendor/**
  - node_modules/**
  - dist/**
verification:
  - name: ci
    command: bun run ci
    required: true
providers:
  default: codex
  externalAllowed: false
  approvalRequired: true
executors:
  planning:
    preferred: gajae-code
    mode: detect-and-suggest
  execution:
    preferred: lazycodex
    mode: detect-and-suggest
  fallback:
    planning: codex
    execution: codex
export:
  markdown: true
  codexNotes: true
