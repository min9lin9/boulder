name: boulder-python-example
description: Codex-ready OSS maintainer harness for boulder-python-example.
maintainers:
  - min9lin9
workflows:
  - issue-triage
  - pr-review-prep
  - release-planning
  - verification-gate
  - dependency-review
protectedPaths:
  - .env*
  - secrets/**
  - vendor/**
  - node_modules/**
  - dist/**
  - coverage/**
verification:
  - name: python-package-check
    command: python -m pip check
    required: false
providers:
  default: codex
  externalAllowed: false
  approvalRequired: true
export:
  markdown: true
  codexNotes: true
