name: boulder-python-example
description: Codex-ready OSS maintainer harness for boulder-python-example.
maintainers:
  - min9lin9
workflowStack:
  - name: superpowers
    role: workflow-spine
    required: true
    description: Drives brainstorming, planning, implementation, debugging, review, and verification discipline.
  - name: gstack
    role: review-gate
    required: true
    description: Adds CSO, QA, executive, and office-hours review gates before risky implementation or release decisions.
  - name: compound
    role: learning-layer
    required: true
    description: Captures reusable decisions, repeated failure modes, and durable workflow improvements after each cycle.
workflows:
  - issue-triage
  - pr-review-prep
  - release-planning
  - verification-gate
  - dependency-review
protectedPaths:
  - .env*
  - secrets/**
  - vendor/**
  - node_modules/**
  - dist/**
  - coverage/**
verification:
  - name: python-package-check
    command: python -m pip check
    required: false
providers:
  default: codex
  externalAllowed: false
  approvalRequired: true
export:
  markdown: true
  codexNotes: true
