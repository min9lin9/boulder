name: boulder-mcp-example
description: Codex-ready OSS maintainer harness for boulder-mcp-example.
maintainers:
  - min9lin9
workflows:
  - issue-triage
  - pr-review-prep
  - release-planning
  - verification-gate
  - dependency-review
protectedPaths:
  - .env*
  - secrets/**
  - vendor/**
  - node_modules/**
  - dist/**
  - coverage/**
verification:
  - name: test
    command: bun run test
    required: true
  - name: typecheck
    command: bun run typecheck
    required: false
providers:
  default: codex
  externalAllowed: false
  approvalRequired: true
export:
  markdown: true
  codexNotes: true
